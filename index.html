<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Substrate4j - Java meets Polkadot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        .logo {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: -2px;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 90%, 100% {
                transform: translate(0);
            }
            92% {
                transform: translate(-2px, 2px);
            }
            94% {
                transform: translate(2px, -2px);
            }
        }

        .tagline {
            font-size: 1.3rem;
            color: #00ff00;
            margin-bottom: 20px;
            font-weight: normal;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #888;
            max-width: 600px;
            line-height: 1.8;
            margin: 0 auto 30px;
        }

        .status-banner {
            background: linear-gradient(90deg, #00ff00 0%, #00cc00 100%);
            color: #000;
            padding: 15px 30px;
            border-radius: 50px;
            display: inline-block;
            font-weight: bold;
            font-size: 1.1rem;
            margin: 30px 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(0, 255, 0, 0);
            }
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }

            .tagline {
                font-size: 1rem;
            }

            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="grid-background"></div>
    
    <div class="container">
        <div class="logo">SUBSTRATE4J</div>
        <div class="tagline">&gt; Java meets Polkadot</div>
        <p class="subtitle">
            The ecosystem waited long enough. A complete, production-ready Java library 
            for building on Substrate and Polkadot. No compromises. No workarounds. Just pure Java power.
        </p>
        <div class="status-banner">⚡ LAUNCHING SOON</div>
    </div>
</body>
</html>
